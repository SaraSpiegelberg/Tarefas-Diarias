# Build do APK Tarefas Diárias via GitHub Actions
#
# Usa a imagem Docker oficial do Buildozer (ghcr.io/kivy/buildozer:latest),
# que já vem pronta com JDK e todas as dependências corretas.
# Nada de action de terceiros (a ArtemSBulgakov quebrava num PPA removido).
#
# Depois do push, o APK fica em Actions > "Build APK" > aba "Artifacts".
# Também dá pra rodar manualmente: Actions > Build APK > Run workflow.

name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build APK (imagem Docker oficial do Buildozer)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/workspace \
            -w /workspace/mobile \
            ghcr.io/kivy/buildozer:latest \
            buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TarefasDiarias-apk
          path: mobile/bin/*.apk
          if-no-files-found: error