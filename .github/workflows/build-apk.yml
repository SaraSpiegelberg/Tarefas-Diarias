# Build do APK Tarefas Diárias via GitHub Actions (sem precisar de Linux local)
#
# Depois de pushar este arquivo, o APK é gerado automaticamente na aba "Actions"
# > "Build APK" > aba "Artifacts": download de "TarefasDiarias-apk".
#
# Também dá pra rodar manualmente: Actions > Build APK > Run workflow.

name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip \
            openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev libffi-dev libssl-dev \
            libtinfo5 patch curl cmake \
            wget file

      - name: Install Buildozer
        run: pip install buildozer cython

      - name: Cache buildozer (SDK/NDK)
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('mobile/buildozer.spec') }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/tools/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

      - name: Build APK (debug)
        working-directory: mobile
        env:
          ANDROIDSDK: $ANDROID_HOME
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TarefasDiarias-apk
          path: mobile/bin/*.apk
          if-no-files-found: error