# Build do APK Tarefas Diárias via GitHub Actions
#
# Usa a action oficial ArtemSBulgakov/buildozer-action, que roda na imagem
# Docker oficial do Buildozer (kivy/buildozer) com todas as dependências de
# sistema corretas — evita o erro do libffi em Ubuntu 24.04.
#
# Depois do push, o APK fica em Actions > "Build APK" > aba "Artifacts".
# Também dá pra rodar manualmente: Actions > Build APK > Run workflow.

name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build APK with Buildozer (Docker oficial)
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          workdir: mobile
          buildozer_version: stable

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TarefasDiarias-apk
          path: mobile/bin/*.apk
          if-no-files-found: error